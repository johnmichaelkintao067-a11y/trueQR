{% extends "base.html" %}
{% block title %}Edit Instructor — ACSI Admin{% endblock %}

{% block content %}
<section class="admin-header">
    <div class="container">
        <div class="admin-header-content">
            <div>
                <h1 class="admin-title">
                    <i class="fas fa-chalkboard-teacher"></i> Edit Instructor
                </h1>
                <p class="admin-sub">Update instructor information</p>
            </div>
            <a href="{{ url_for('admin_instructors') }}" class="btn btn-outline-sm">
                <i class="fas fa-arrow-left"></i> Back to Instructors
            </a>
        </div>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="admin-card" style="max-width: 600px; margin: 0 auto;">
            <form method="POST" action="{{ url_for('admin_instructor_edit', instr_id=instructor.id) }}">

                <div class="form-group">
                    <label class="form-label">FULL NAME <span class="required">*</span></label>
                    <input type="text" name="name" class="form-input"
                        value="{{ instructor.name }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">EMAIL <span class="optional">(optional)</span></label>
                    <input type="email" name="email" class="form-input"
                        value="{{ instructor.email or '' }}"
                        placeholder="e.g. juan@acsi.edu.ph">
                </div>

                <div class="form-group">
                    <label class="form-label">CONTACT NUMBER <span class="optional">(optional)</span></label>
                    <input type="text" name="contact" class="form-input"
                        value="{{ instructor.contact or '' }}"
                        placeholder="e.g. 09XX-XXX-XXXX">
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                    <a href="{{ url_for('admin_instructors') }}" class="btn btn-outline-sm">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>
</section>
{% endblock %}
