{% extends "base.html" %}
{% block title %}Settings — ACSI Admin{% endblock %}

{% block content %}
<section class="admin-header">
    <div class="container">
        <div class="admin-header-content">
            <div>
                <h1 class="admin-title"><i class="fas fa-cog"></i> Settings</h1>
                <p class="admin-sub">Update your admin credentials</p>
            </div>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-sm">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </div>
    </div>
</section>

<section class="section">
    <div class="container">
        <div class="admin-card" style="max-width: 500px; margin: 0 auto;">
            <h2 class="card-title"><i class="fas fa-user-shield"></i> Change Credentials</h2>

            <form method="POST" action="{{ url_for('admin_settings') }}">

                <div class="form-group">
                    <label class="form-label">USERNAME <span class="required">*</span></label>
                    <input type="text" name="username" class="form-input"
                        value="{{ current_user.username }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">CURRENT PASSWORD <span class="required">*</span></label>
                    <input type="password" name="current_password" class="form-input"
                        placeholder="Enter your current password" required>
                </div>

                <div class="form-group">
                    <label class="form-label">NEW PASSWORD <span class="optional">(leave blank to keep current)</span></label>
                    <input type="password" name="new_password" class="form-input"
                        placeholder="Enter new password">
                </div>

                <div class="form-hint" style="margin-bottom: 1.5rem;">
                    <i class="fas fa-info-circle"></i>
                    You must enter your current password to save any changes.
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>
</section>
{% endblock %}
